<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyPresso</title>
<meta name="description" content="A playful presentation maker for kids. Pick a topic, add stickers, pictures and drawings, then press Show time!">
<meta property="og:title" content="MyPresso">
<meta property="og:description" content="A playful presentation maker for kids. Pick a topic, add stickers, pictures and drawings, then press Show time!">
<meta name="theme-color" content="#6D4AFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23FF4FA3' stroke='%232A2152' stroke-width='5'/%3E%3Cpath d='M26 20 L46 32 L26 44Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&family=Baloo+2:wght@500;700;800&family=Chewy&family=Patrick+Hand&family=Bubblegum+Sans&family=Luckiest+Guy&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Sticker-book studio: chunky outlined panels with hard shadows around one big central stage */
:root{
  --bg:#E9ECFF; --dots:#D2D7FA; --panel:#FFFFFF; --ink:#2A2152; --ink-soft:#615A8E; --line:#2A2152;
  --grape:#6D4AFF; --tangerine:#FF8A4C; --mint:#22C49A; --sun:#FFC83D; --pink:#FF4FA3; --sky:#CFE8FF;
  --danger:#E5484D; --stage:#120D33;
  --ui:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--ui);background:var(--bg) radial-gradient(var(--dots) 1.5px,transparent 1.7px) 0 0/22px 22px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.panel{background:var(--panel);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--line)}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--ui);letter-spacing:-.5px;user-select:none}
.logo-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--pink);color:#fff;font-size:17px;border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line);transform:rotate(-6deg)}
.logo-word b:nth-child(1){color:var(--grape)} .logo-word b:nth-child(2){color:var(--tangerine)} .logo-word b:nth-child(3){color:var(--mint)}
.title-input{flex:1 1 180px;min-width:0;font:600 18px var(--ui);color:var(--ink);padding:9px 14px;border:2.5px dashed transparent;border-radius:14px;background:transparent}
.title-input:hover{border-color:#B9B3E0}
.title-input:focus{outline:none;border-color:var(--grape);background:#fff}
.top-actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{font:600 15px/1 var(--ui);padding:10px 14px;border-radius:14px;border:2.5px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F6F4FF}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.icon{padding:10px 11px;min-width:42px;justify-content:center}
.btn.go{background:var(--grape);color:#fff}
.btn.go:hover{background:#5B38F0}
.btn.warm{background:var(--sun)}
.btn.warm:hover{background:#FFBA14}
.btn.sm{font-size:13px;padding:7px 10px;border-radius:11px;box-shadow:0 2px 0 var(--line)}
.btn.danger{color:var(--danger)}
.btn.big{font-size:18px;padding:14px 18px}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 3px 0 var(--line)}

/* main layout */
.main{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:16px;padding:0 16px 16px;min-height:0}
.slides-col{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:0}
.col-head{font:600 13px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding-left:4px}
.thumbs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 4px 6px}
.thumb{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.tnum{font:600 13px/1 var(--ui);width:14px;padding-top:4px;color:var(--ink-soft)}
.tbox{width:150px;height:84.375px;border-radius:10px;border:2.5px solid var(--line);overflow:hidden;position:relative;flex:none;background:#fff}
.tbox .slide{pointer-events:none}
.thumb.on .tbox{outline:4px solid var(--pink);outline-offset:2px}
.thumb.on .tnum{color:var(--pink)}
.thumb.drag-over .tbox{outline:4px dashed var(--grape);outline-offset:2px}
.add-slide{justify-content:center;background:var(--sun)}

.center{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.toolstrip{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;padding:7px 8px 6px;border-radius:14px;border:2.5px solid transparent;background:none;cursor:pointer;font:600 13px var(--ui)}
.tool span{font-size:24px;line-height:1}
.tool:hover{background:#F2EFFF}
.tool.on{background:var(--sky);border-color:var(--line)}
.drawer{padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.drawer-x{position:absolute;right:8px;top:8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-right:44px}
.tab{font:600 13px var(--ui);padding:6px 10px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.emoji-grid{display:flex;flex-wrap:wrap;gap:2px;max-height:132px;overflow:auto}
.emo{font-size:30px;line-height:1;width:46px;height:46px;border:0;border-radius:12px;background:none;cursor:pointer;transition:transform .12s}
.emo:hover{background:#F2EFFF;transform:scale(1.2) rotate(-6deg)}
.drow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dlabel{font:600 13px var(--ui);color:var(--ink-soft);min-width:52px}
.shape-btn{width:56px;height:46px;border-radius:12px;border:2px solid #DDD8F5;background:#fff;cursor:pointer;display:grid;place-items:center;padding:6px}
.shape-btn:hover{border-color:var(--line)}
.shape-btn svg,.shape-btn div{width:100%;height:100%}

.stage-wrap{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.stage{position:relative;border-radius:14px;box-shadow:0 0 0 2.5px var(--line),6px 6px 0 var(--line);overflow:hidden;background:#fff;touch-action:none}
.stage.drop{box-shadow:0 0 0 5px var(--pink),6px 6px 0 var(--line)}
.tip{display:flex;gap:8px;align-items:center;font:500 14px var(--ui);color:var(--ink-soft);min-height:20px;padding-left:4px}

.inspector{padding:14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.ih{margin:0;font:600 20px/1.1 var(--ui)}
.hint{margin:0;font:500 14px/1.4 var(--body);color:var(--ink-soft)}
.isec{display:flex;flex-direction:column;gap:7px}
.il{font:600 12px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.num{font:600 16px var(--ui);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px/1 var(--ui);padding:7px 11px;border-radius:999px;border:2px solid #D8D3F2;background:#fff;cursor:pointer}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);cursor:pointer;padding:0;font:600 10px var(--ui)}
.sw.sq{border-radius:9px;width:38px;height:28px}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink)}
.sw-auto{background:conic-gradient(#ff4fa3,#ffc83d,#22c49a,#5bc0ff,#6d4aff,#ff4fa3)!important}
.inp,.txta{width:100%;font:600 16px var(--body);color:var(--ink);padding:10px 12px;border:2.5px solid var(--line);border-radius:12px;background:#fff}
.txta{min-height:90px;resize:vertical;font-weight:500;line-height:1.4}
.qrow{display:flex;gap:6px;align-items:center}
.qrow .inp{flex:1;min-width:0;padding:8px 10px;font-size:15px}
.qok{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
.qok.on{background:var(--mint)}

/* levels + word helper */
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 8px;border-radius:16px;border:2.5px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line);font-family:var(--ui)}
.lvl b{font:600 17px/1.1 var(--ui)} .lvl span{font:500 13px var(--body);color:var(--ink-soft)}
.lvl .lvl-ico{font-size:34px;line-height:1.1;color:inherit}
.lvl em{font:600 11px var(--ui);font-style:normal;text-transform:uppercase;letter-spacing:.06em;background:#ECE9F8;color:var(--ink-soft);padding:3px 7px;border-radius:999px;margin-top:2px}
.lvl.on{background:var(--sun);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink)}
.lvl:disabled{opacity:.55;cursor:default;box-shadow:none;border-style:dashed}
/* kid-facing New show */
.modal.kid{width:min(940px,100%);padding:20px 22px}
.kid-stars{display:flex;gap:6px;font-size:24px;line-height:1;margin-bottom:10px;padding-right:48px}
.kid-q{font:700 34px/1.15 var(--ui)!important;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 4px!important}
.kid-sub{font-size:17px!important;margin-bottom:14px!important}
.kid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.kcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px;min-height:120px;border-radius:20px;border:2.5px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;font:600 17px/1.15 var(--ui);text-align:center;transition:transform .12s}
.kcard:hover{transform:translateY(-3px) rotate(-1deg);background:#FFFBEA}
.kcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kcard .k-ico{font-size:48px;line-height:1}
.kcard.on{background:var(--sun);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--pink)}
.kcard.other{border-style:dashed;background:#F6F4FF}
.stage-seed .kid-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stage-seed .kcard{min-height:150px;font-size:20px}
.stage-seed .kcard .k-ico{font-size:66px}
.stage-seed .kid-q{font-size:40px!important}
.kid-themes{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.kid-themes .tc-ico{font-size:54px}
.kid-themes .tc-name{font-size:15px}
.kid-type{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 16px}
.kid-inp{flex:1 1 240px;min-width:0;font:600 26px var(--ui)!important;padding:14px 16px!important;border-radius:16px!important}
.kid-hint{margin:14px 0 6px!important}
.kid-next{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.kid-next.center{justify-content:center}
.kid-go{font-size:22px!important;padding:16px 24px!important}
.kid-preview{width:min(560px,100%);aspect-ratio:16/9;margin:6px auto 0;border-radius:18px;border:2.5px solid var(--line);box-shadow:5px 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
.kid-preview .k-ico{font-size:64px;line-height:1;animation:d-bounce 1.2s ease-in-out infinite}
.kid-preview b{font-size:clamp(26px,5vw,42px);font-weight:400;line-height:1.05;text-wrap:balance}
.kid-preview span:last-child{font:600 20px var(--ui)}
.kid-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:14px;border-top:2px dashed #DDD8F5}
.linkbtn{background:none;border:0;padding:6px 0;font:500 14px var(--body);color:var(--ink-soft);text-decoration:underline;cursor:pointer}
/* home */
.home{width:min(1120px,100%);margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:26px}
.home-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.home-top-acts{display:flex;gap:8px}
#homeLevel span{color:var(--ink-soft);font-weight:500}
#logoHome{cursor:pointer}
.home-hero{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.mascot{width:132px;height:auto;flex:none;overflow:visible}
.m-bob{animation:m-bob 2.4s ease-in-out infinite;transform-origin:70px 136px}
.m-arm{animation:m-wave 1.6s ease-in-out infinite;transform-origin:120px 92px}
.m-eyes{animation:m-blink 4.5s infinite;transform-origin:70px 86px}
@keyframes m-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes m-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes m-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.hello{min-width:0;flex:1 1 260px}
.hello h1{margin:0;font:700 clamp(40px,7vw,64px)/1 var(--ui);letter-spacing:-1px;color:var(--grape);text-wrap:balance}
.hello p{margin:8px 0 0;font:600 clamp(20px,3vw,26px)/1.3 var(--ui);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.home-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.new-card{position:relative;overflow:hidden;min-height:250px;border-radius:28px;border:3px solid var(--line);box-shadow:6px 6px 0 var(--line);cursor:pointer;color:#fff;
  background:radial-gradient(circle at 30% 20%,#8B6BFF 0%,var(--grape) 55%,#4F2FD6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 20px;transition:transform .15s,box-shadow .15s}
.new-card:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:9px 10px 0 var(--line)}
.new-card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.new-card b{font:700 clamp(30px,4.5vw,44px)/1.05 var(--ui);text-shadow:0 3px 0 rgba(0,0,0,.18);text-align:center}
.new-card > span:last-child{font:500 18px/1.3 var(--ui);opacity:.92;text-align:center}
.nc-plus{font-size:64px;line-height:1;animation:d-pulse 1.6s ease-in-out infinite}
.nc-stk{position:absolute;font-size:40px;line-height:1;opacity:.85;animation:floaty 5s ease-in-out infinite}
.nc-stk:nth-child(2n){animation-duration:6.4s;animation-delay:-2s}
.cont-card{display:flex;flex-direction:column;gap:14px;padding:16px;cursor:pointer;transition:transform .15s}
.cont-card:hover{transform:translateY(-3px)}
.cont-info{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.eyebrow{font:600 12px var(--ui);text-transform:uppercase;letter-spacing:.1em;color:var(--pink)}
.cont-info b{font:600 24px/1.15 var(--ui);overflow-wrap:anywhere}
.cont-meta{font:500 14px var(--body);color:var(--ink-soft)}
.cont-btn{margin-top:6px;pointer-events:none}
.hthumb{position:relative;overflow:hidden;border-radius:14px;border:2.5px solid var(--line);flex:none;background:#fff}
.hthumb .slide{pointer-events:none}
.shelf{display:flex;flex-direction:column;gap:14px}
.shelf-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.shelf-head h2{margin:0;font:700 28px/1 var(--ui)}
.show-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.show-card{background:var(--panel);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--line);padding:9px 9px 12px;display:flex;flex-direction:column;gap:9px;transform:rotate(var(--tilt,0deg));transition:transform .15s}
.show-card:hover{transform:rotate(0) translateY(-3px)}
.show-open{border:0;background:none;padding:0;cursor:pointer;display:flex;justify-content:center}
.show-open .hthumb{border-radius:12px}
.show-title{font:600 17px/1.2 var(--ui);padding:0 4px;overflow-wrap:anywhere}
.show-acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
@media (max-width: 760px){ .home-main{grid-template-columns:minmax(0,1fr)} .mascot{width:104px} }
@media (prefers-reduced-motion: reduce){ .m-bob,.m-arm,.m-eyes,.nc-plus,.nc-stk{animation:none} }
.stage-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.stage-card{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px;border-radius:16px;border:2.5px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.stage-card .sc-ico{font-size:30px;line-height:1}
.stage-card .sc-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.stage-card b{font:600 16px/1.15 var(--ui)}
.stage-card .sc-txt span{font:500 13px/1.35 var(--body);color:var(--ink-soft)}
.stage-card.on{background:#E3F8EF;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--mint)}
.wprompt{font:600 18px/1.35 var(--ui);background:#EEF6FF;border:2px dashed #8FB8E8;border-radius:14px;padding:8px 12px;padding-right:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.wgrid.big .wchip{font-size:26px;padding:12px 16px}
.checklist{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ck{font:600 14px/1 var(--ui);padding:7px 11px;border-radius:999px;border:2px dashed #C9C3E6;color:var(--ink-soft)}
.ck.done{border:2px solid var(--line);background:var(--mint);color:var(--ink)}
.ck.done::after{content:' ⭐'}
.wgrid{display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow:auto;padding:2px 2px 4px}
.wchip{font:600 21px/1 var(--ui);padding:9px 14px;border-radius:14px;border:2.5px solid var(--line);background:#FFF6D6;box-shadow:0 3px 0 var(--line);cursor:pointer}
.wchip:hover{background:#FFEDA8}
.wchip:active{transform:translateY(3px);box-shadow:none}
.say-tip{margin-left:2px;padding:4px 7px;min-width:0;box-shadow:0 2px 0 var(--line)}
.simple .tool{min-width:78px;font-size:15px}
.simple .tool span{font-size:30px}
.simple .inspector .btn{font-size:16px}

/* slide canvas (logical 1600 x 900) */
.slide{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:hidden;transform-origin:0 0;font-family:'Fredoka',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.deco span{position:absolute;opacity:.5;line-height:1;pointer-events:none;transform:rotate(var(--r,0deg))}
.drawing,.draw-layer{position:absolute;left:0;top:0;width:100%;height:100%}
.drawing{pointer-events:none}
.draw-layer{cursor:crosshair;touch-action:none;z-index:50}
.el{position:absolute;transform-origin:center center}
.pop,.inner{width:100%;height:100%}
.el-text .pop,.el-text .inner,.el-quiz .pop,.el-quiz .inner{height:auto}
.txt{white-space:pre-wrap;overflow-wrap:break-word;line-height:1.15;outline:none;cursor:inherit}
.txt.empty::before{content:attr(data-ph);opacity:.4}
.txt.prompt::before{font-size:.62em;line-height:1.3;opacity:.6;display:block}
.txt.prompt{border:.06em dashed currentColor;border-radius:.4em;padding:.3em .45em;min-height:2.4em}
.tstyle-card{padding:.35em .6em;border-radius:.45em;box-shadow:0 .1em 0 rgba(0,0,0,.12)}
.tstyle-outline{text-shadow:.05em 0 0 var(--oc),-.05em 0 0 var(--oc),0 .05em 0 var(--oc),0 -.05em 0 var(--oc),.035em .035em 0 var(--oc),-.035em .035em 0 var(--oc),.035em -.035em 0 var(--oc),-.035em -.035em 0 var(--oc),0 .12em 0 rgba(0,0,0,.18)}
.stk{text-align:center;line-height:1;display:grid;place-items:center;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.imgbox{width:100%;height:100%;overflow:hidden;border-radius:16px}
.imgbox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.frame-frame{border:16px solid #fff;border-radius:10px;box-shadow:0 10px 0 rgba(0,0,0,.14)}
.frame-circle{border-radius:50%;border:14px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.14)}
.img-ph{width:100%;height:100%;border:8px dashed rgba(42,33,82,.45);border-radius:24px;background:rgba(255,255,255,.55);display:grid;place-content:center;text-align:center;font:600 46px/1.3 'Fredoka',sans-serif;color:#2A2152}
.img-ph small{display:block;font-size:30px;font-weight:500;opacity:.7}
.shp{width:100%;height:100%}
.shp svg{width:100%;height:100%;display:block;overflow:visible}
.quiz .q-q{line-height:1.15;margin-bottom:.6em;text-align:center}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.q-opt{border:0;border-radius:28px;color:#fff;padding:.55em .7em;font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.15;box-shadow:0 10px 0 rgba(0,0,0,.2);position:relative;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.q-opt.right::after{content:'✅';position:absolute;right:-.3em;top:-.5em;font-size:1.3em}
.q-opt.right{animation:qyay .6s}
.q-opt.wrong{animation:qshake .5s;opacity:.55}

/* edit-mode selection */
.edit .el{cursor:move}
.edit .el:hover{outline:calc(3px*var(--inv,1)) dashed rgba(109,74,255,.45);outline-offset:calc(5px*var(--inv,1))}
.edit .el.sel{outline:calc(3px*var(--inv,1)) dashed #6D4AFF;outline-offset:calc(6px*var(--inv,1))}
.edit .el.editing{cursor:text;outline-style:solid}
.edit .el.editing .txt{user-select:text;-webkit-user-select:text;cursor:text}
.h{position:absolute;width:calc(30px*var(--inv,1));height:calc(30px*var(--inv,1));border-radius:50%;background:#FF4FA3;border:calc(4px*var(--inv,1)) solid #fff;box-shadow:0 0 0 calc(2px*var(--inv,1)) #2A2152;z-index:5;display:grid;place-items:center;color:#fff;font:700 calc(16px*var(--inv,1))/1 'Fredoka',sans-serif}
.h-resize{right:calc(-21px*var(--inv,1));bottom:calc(-21px*var(--inv,1));cursor:nwse-resize}
.h-rot{left:50%;top:calc(-58px*var(--inv,1));margin-left:calc(-15px*var(--inv,1));background:#6D4AFF;cursor:grab}

/* dances + entrances (show mode) */
.dance-bounce{animation:d-bounce 1.1s ease-in-out infinite}
.dance-wiggle{animation:d-wiggle .9s ease-in-out infinite}
.dance-spin{animation:d-spin 4s linear infinite}
.dance-pulse{animation:d-pulse 1.2s ease-in-out infinite}
.dance-float{animation:d-float 3.2s ease-in-out infinite}
@keyframes d-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@keyframes d-wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes d-spin{to{transform:rotate(360deg)}}
@keyframes d-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes d-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7%) rotate(3deg)}}
.pop-in{animation:popIn .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.showing .deco span{animation:floaty 5s ease-in-out infinite}
.showing .deco span:nth-child(2n){animation-duration:6.5s;animation-delay:-2s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-18px) rotate(calc(var(--r,0deg) + 8deg))}}
@keyframes qyay{40%{transform:scale(1.12)}}
@keyframes qshake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(42,33,82,.45);display:grid;place-items:center;padding:16px;z-index:80;overflow:auto}
.modal{width:min(860px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;position:relative}
.modal h2{margin:0 0 6px;font:700 28px/1.1 var(--ui);text-wrap:balance}
.modal .sub{margin:0 0 16px;font:500 15px/1.4 var(--body);color:var(--ink-soft)}
.modal-x{position:absolute;right:14px;top:14px}
.lbl{display:block;font:600 15px var(--ui);margin:16px 0 8px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{position:relative;aspect-ratio:16/9;border-radius:14px;border:2.5px solid var(--line);overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;max-width:100%}
.tcard .tc-ico{font-size:44px;line-height:1;transition:transform .2s}
.tcard:hover .tc-ico{transform:scale(1.2) rotate(-8deg)}
.tcard .tc-deco{position:absolute;font-size:20px;opacity:.6}
.tcard .tc-name{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:2.5px solid var(--line);font:600 13px/1 var(--ui);padding:6px 4px;color:var(--ink)}
.tcard.on{outline:4px solid var(--pink);outline-offset:3px}
.layout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;justify-items:center}
.lcard{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;font:600 15px var(--ui)}
.lbox{width:200px;height:112.5px;position:relative;overflow:hidden;border-radius:12px;border:2.5px solid var(--line);transition:transform .15s}
.lcard:hover .lbox{transform:translateY(-3px) rotate(-1deg);box-shadow:4px 4px 0 var(--line)}
.lbox .slide{pointer-events:none}
.wz-go{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.plist{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px;border:2px solid #DDD8F5;border-radius:16px}
.prow.cur{border-color:var(--grape);background:#F6F3FF}
.pinfo{flex:1 1 160px;min-width:0}
.pinfo b{display:block;font:600 18px/1.2 var(--ui);overflow-wrap:anywhere}
.pinfo span{font:500 13px var(--body);color:var(--ink-soft)}

/* present mode */
.present{position:fixed;inset:0;background:var(--stage);z-index:100;color:#fff}
.p-area{position:absolute;left:16px;right:16px;top:16px;bottom:84px;display:grid;place-items:center}
.p-holder{grid-area:1/1;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.p-holder .q-opt{pointer-events:auto;cursor:pointer}
.p-holder .q-opt:hover{filter:brightness(1.1)}
.p-bar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(255,255,255,.1);max-width:calc(100% - 24px);overflow-x:auto}
.p-bar button{background:none;border:0;color:#fff;font:600 15px/1 var(--ui);padding:10px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.p-bar button:hover{background:rgba(255,255,255,.16)}
.p-bar button.on{background:rgba(255,255,255,.28)}
#pCount{font:600 15px var(--ui);padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-sep{width:1px;height:22px;background:rgba(255,255,255,.25);margin:0 4px;flex:none}
.p-notes{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;width:min(760px,calc(100% - 32px));background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;padding:12px 16px;font:500 18px/1.4 var(--body);z-index:3;white-space:pre-wrap}
.enter-pop{animation:e-pop .6s cubic-bezier(.3,1.5,.5,1) both}
.enter-slide{animation:e-slide .55s cubic-bezier(.2,.9,.3,1) both}
.enter-zoom{animation:e-zoom .6s cubic-bezier(.2,.9,.3,1) both}
.enter-spin{animation:e-spin .8s cubic-bezier(.3,1.3,.5,1) both}
.enter-bounce{animation:e-bounce .9s both}
.enter-fade{animation:e-fade .6s both}
.leaving{animation:e-leave .4s forwards;z-index:-1}
@keyframes e-pop{from{transform:scale(.6);opacity:0}}
@keyframes e-slide{from{transform:translateX(calc(var(--dir,1)*70vw));opacity:0}}
@keyframes e-zoom{from{transform:scale(1.6);opacity:0}}
@keyframes e-spin{from{transform:rotate(-200deg) scale(.15);opacity:0}}
@keyframes e-bounce{0%{transform:translateY(-110vh)}55%{transform:translateY(0)}70%{transform:translateY(-6%)}85%{transform:translateY(0)}93%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}
@keyframes e-fade{from{opacity:0}}
@keyframes e-leave{to{opacity:0;transform:scale(.94)}}
.spark{position:fixed;pointer-events:none;z-index:160;font-size:24px;line-height:1;animation:spark .9s ease-out forwards;translate:-50% -50%}
@keyframes spark{to{opacity:0;transform:translateY(-40px) scale(.4) rotate(90deg)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font:600 15px/1.3 var(--ui);padding:12px 18px;border-radius:14px;z-index:300;max-width:calc(100% - 32px);box-shadow:4px 4px 0 var(--pink)}

@media (max-width: 1100px){ .main{grid-template-columns:190px minmax(0,1fr) 250px} }
@media (max-width: 900px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .center{order:1} .slides-col{order:2} .inspector{order:3;overflow:visible}
  .thumbs{flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .tool{min-width:0;flex:1 1 60px}
  .logo{font-size:22px}
}
@media (prefers-reduced-motion: reduce){
  [class*="dance-"],.showing .deco span{animation:none!important}
  .pop-in,.p-holder,.leaving{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>

/* Year 1: few words per slide and big letters. The stage sets how much help the writing gets:
   seed = one short sentence with a gap, sprout = sentence starters with gaps, tree = question prompts to answer in their own words. */
function L1(key, th, d = {}){
  const t = THEMES[th] || THEMES.space;
  const st = d.stage || 'sprout';
  const seed = st === 'seed', tree = st === 'tree';
  const bodySize = seed ? 92 : tree ? 64 : 76;
  const pick = (a, b, c) => seed ? a : tree ? c : b;
  switch (key){
    case 'title': return SL([
      T({role:'title', x:150, y:170, w:1300, size:160, text:d.title || 'My Presentation'}),
      T({x:300, y:590, w:1000, size:72, bold:false, text:d.sub || 'By ____'}),
      S(d.icon || t.icon, 1330, 640, 190, 'bounce')], {transition:'zoom'});
    case 'look': return SL([
      T({role:'title', x:120, y:60, w:1360, size:110, text:d.title || pick('Look!', 'Look!', 'What is it?')}),
      ...(d.sticker ? [S(d.sticker, 230, 250, 440, 'float')] : [IMG({x:150, y:220, w:640, h:480, rot:-2})]),
      T({x:860, y:300, w:620, size:bodySize, align:'left', text:d.body ?? pick('This is a ____.', 'This is a ____.', ''),
         ph:'Write what it is. Where does it live or where can you find it?'})]);
    case 'describe': return SL([
      T({role:'title', x:120, y:60, w:1360, size:110, text:d.title || 'What is it like?'}),
      T({x:220, y:260, w:1160, size:bodySize, style:'card', align:'left', bold:false,
         text:d.body ?? pick('It is ____.', 'It is ____.\nIt has ____.\nIt can ____.', ''),
         ph:'Write 2 sentences about what it looks like or what it can do. Join two ideas with "and".'}),
      S(d.icon || '🔍', 1340, 660, 170, 'wiggle')]);
    case 'like': return SL([
      T({role:'title', x:120, y:60, w:1360, size:110, text:d.title || 'Why I like it'}),
      S('❤️', 140, 320, 220, 'pulse'),
      T({x:420, y:320, w:1060, size:bodySize, align:'left', style:'card', bold:false,
         text:d.body ?? pick('I like it. It is ____.', 'I like it because ____.', ''),
         ph:'Why do you like it? Use the word "because".'})]);
    case 'wow': return SL([
      T({role:'title', x:150, y:90, w:1300, size:190, style:'outline', text:'Wow!'}),
      T({x:250, y:400, w:1100, size:bodySize, style:'card', bold:false,
         text:d.body ?? pick('It is so ____!', 'Did you know? ____', ''),
         ph:'Write an amazing fact you found out.'}),
      S('🤩', 1300, 650, 170, 'bounce'), S('✨', 180, 660, 130, 'spin')]);
    case 'quiz': return SL([
      T({role:'title', x:150, y:50, w:1300, size:110, text:'Can you guess?'}),
      Q({x:250, y:250, w:1100, size:72, question:d.q || pick('Is it ____?', 'Is it ____?', 'Type your question?'),
         options:d.opts || (tree ? ['Answer 1', 'Answer 2', 'Answer 3'] : ['Yes 👍', 'No 👎']), correct:d.correct || 0}),
      S('🤔', 1380, 60, 140, 'wiggle')]);
    case 'end': return SL([
      T({role:'title', x:150, y:170, w:1300, size:200, text:'The End!'}),
      T({x:250, y:490, w:1100, size:76, bold:false, text:d.body || 'Thank you for watching!'}),
      S('👏', 260, 640, 150, 'bounce'), S('🎉', 1190, 630, 160, 'wiggle')], {transition:'spin'});
    default: return SL([]);
  }
}

function starterProject(topic, name, th, lvl = 'y1', stage = 'sprout'){
  const title = topic ? `All About ${topic}` : 'My Presentation';
  const lay = LEVELS[lvl].layout || L;
  const like = stage === 'sprout' && topic ? {body:`I like ${topic.toLowerCase()} because ____.`} : {};
  const keys = stage === 'seed' ? ['look', 'describe', 'like', 'quiz'] : ['look', 'describe', 'like', 'wow', 'quiz'];
  return {id:uid(), title, theme:th, topic, level:lvl, stage, slides:[
    lay('title', th, {title, sub: name ? `By ${name}` : 'By ____', stage}),
    ...keys.map(k => lay(k, th, k === 'like' ? {...like, stage} : {stage})),
    lay('end', th, {stage}),
  ]};
}

function saveNow(){
  if (project.temp) return;
  project.updated = Date.now();
  const ok = lsSet(PK + project.id, JSON.stringify(project));
  const idx = loadIndex().filter(p => p.id !== project.id);
  idx.unshift({id:project.id, title:project.title, theme:project.theme, updated:project.updated});

  lsSet(CUR, project.id);

function commit(){
  const s = JSON.stringify(project);

  undoStack.push(lastState); if (undoStack.length > 40) undoStack.shift();
  redoStack = []; lastState = s;

  stopDraw(true);

function buildSlide(slide, t, opts = {}){
  const el = document.createElement('div');
  el.className = 'slide' + (opts.edit ? ' edit' : '') + (opts.present ? ' showing' : '');
  el.style.background = slide.bg || t.bg;
  el.style.color = t.ink;
  el.style.setProperty('--oc', t.outline);
  if (slide.deco !== false){
    const d = document.createElement('div'); d.className = 'deco';
    const h = hash(slide.id);
    DECO_SPOTS.forEach((s, i) => {
      const sp = document.createElement('span');
      sp.textContent = t.deco[(i + h) % t.deco.length];
      sp.style.cssText = `left:${s[0]}%;top:${s[1]}%;font-size:${s[2]}px;--r:${s[3]}deg`;
      d.appendChild(sp);
    });
    el.appendChild(d);
  }
  if (slide.drawing){
    const img = new Image(); img.src = slide.drawing; img.className = 'drawing'; img.alt = ''; img.draggable = false;
    el.appendChild(img);
  }
  slide.els.forEach((e, i) => el.appendChild(buildEl(e, t, opts, i)));
  return el;
}
function buildEl(e, t, opts = {}, i = 0){
  const el = document.createElement('div');
  el.className = 'el el-' + e.type; el.dataset.id = e.id;
  el.style.left = e.x + 'px'; el.style.top = e.y + 'px'; el.style.width = e.w + 'px';

/* ---------- pointer interactions on the stage ---------- */
stageWrap.addEventListener('pointerdown', e => {
  if (mode === 'draw') return;
  const elDom = e.target.closest('.el');
  if (editingId && elDom && elDom.dataset.id === editingId) return;
  if (editingId) stopEditing();
  if (!elDom || !stage.contains(elDom)){ if (selId) select(null); return; }
  const m = findEl(elDom.dataset.id); if (!m) return;
  e.preventDefault();
  const wasSelected = selId === m.id;
  if (!wasSelected) select(m.id);
  const handle = e.target.closest('.h');
  const kind = handle ? (handle.classList.contains('h-rot') ? 'rot' : 'resize') : 'move';
  const st = {x:e.clientX, y:e.clientY, mx:m.x, my:m.y, mw:m.w, mh:m.h, size:m.size};
  const r = slideEl.querySelector(`.el[data-id="${m.id}"]`).getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let moved = false;
  const move = ev => {
    const dx = (ev.clientX - st.x) / scale, dy = (ev.clientY - st.y) / scale;
    if (!moved && Math.hypot(ev.clientX - st.x, ev.clientY - st.y) < 4) return;
    moved = true;
    const dom = slideEl.querySelector(`.el[data-id="${m.id}"]`);
    if (kind === 'move'){
      m.x = Math.round(clamp(st.mx + dx, -m.w + 60, W - 60));
      m.y = Math.round(clamp(st.my + dy, -200, H - 60));
      dom.style.left = m.x + 'px'; dom.style.top = m.y + 'px';
    } else if (kind === 'rot'){
      let a = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90;
      a = ((a + 540) % 360) - 180;
      for (const snap of [-180, -90, 0, 90, 180]) if (Math.abs(a - snap) < 6) a = snap;
      m.rot = Math.round(a);
      dom.style.transform = m.rot ? `rotate(${m.rot}deg)` : '';
    } else {
      if (m.type === 'text' || m.type === 'quiz'){
        const nw = Math.max(120, st.mw + dx); const k = nw / st.mw;
        m.w = Math.round(nw); m.size = clamp(Math.round(st.size * k), 14, 420);
      } else if (m.type === 'sticker'){
        const d = Math.max(dx, dy); m.w = m.h = Math.round(clamp(st.mw + d, 40, 900));
      } else if (m.type === 'image'){
        const nw = clamp(st.mw + dx, 80, 1600); m.w = Math.round(nw); m.h = Math.round(nw * st.mh / st.mw);
      } else {
        m.w = Math.round(Math.max(40, st.mw + dx));
        m.h = Math.round(ev.shiftKey ? m.w * st.mh / st.mw : Math.max(40, st.mh + dy));
      }
      replaceEl(m);
    }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (moved){ commit(); if (kind === 'resize') renderInspector(); return; }
    if (kind !== 'move') return;
    if (m.type === 'image' && !m.src){ pendingImg = m.id; fileInput.click(); }
    else if (wasSelected && m.type === 'text') startEditing(m.id);
    else if (wasSelected && m.type === 'quiz'){ const q = $('#qQuestion'); if (q){ q.focus(); q.select(); } }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});

/* Select the next ____ blank after the caret (wrapping round), so typing fills it in. */
function selectBlank(dom, fromCaret){
  const txt = dom.firstChild;
  if (!txt || txt.nodeType !== 3 || dom.childNodes.length !== 1) return false;
  const re = /_{2,}/g;
  let start = 0;
  if (fromCaret){ const s = getSelection(); if (s.rangeCount && s.focusNode === txt) start = Math.max(s.anchorOffset, s.focusOffset); }
  re.lastIndex = start;
  let mm = re.exec(txt.data);
  if (!mm){ re.lastIndex = 0; mm = re.exec(txt.data); }
  if (!mm) return false;
  const r = document.createRange(); r.setStart(txt, mm.index); r.setEnd(txt, mm.index + mm[0].length);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  return true;
}
const editingDom = () => editingId && slideEl ? slideEl.querySelector(`.el[data-id="${editingId}"] .txt`) : null;

  const r = s.getRangeAt(0);
  const before = r.startContainer.nodeType === 3 ? r.startContainer.data.slice(0, r.startOffset) : '';
  const after = r.endContainer.nodeType === 3 ? r.endContainer.data.slice(r.endOffset) : '';
  const pre = before && !/\s$/.test(before) ? ' ' : '';
  const post = /^[\s.,!?]/.test(after) ? '' : ' ';
  document.execCommand('insertText', false, pre + w + post);

    // Jump to the next gap; once every gap is filled, read the finished sentence back
    if (/_{2,}/.test(dom.innerText)) { say(w); selectBlank(dom, true); }
    else { const sentence = dom.innerText; say(w).then(() => wait(250)).then(() => say(sentence)); }

/* Year 1 writing checklist: capital letters, full stops and a joining word */
let checkedAll = false;
function checkWriting(text){
  const sentences = text.replace(/_{2,}/g, '').split(/(?<=[.!?])\s+|\n+/).map(s => s.replace(/[^\p{L}\p{N}.!?'"]+$/u, '').trim()).filter(s => /\p{L}/u.test(s));
  const firstLetter = s => (s.match(/\p{L}/u) || [''])[0];
  return {
    capital: sentences.length > 0 && sentences.every(s => { const c = firstLetter(s); return c && c === c.toUpperCase(); }),
    stop: sentences.length > 0 && sentences.every(s => /[.!?]$/.test(s)),
    join: /\b(and|because|but|so|then|when)\b/i.test(text),
  };
}

  if (c.capital && c.stop && c.join && !checkedAll){

/* Speaks text and resolves once it has finished, so callers can wait before moving on.
   A short pause after stopping earlier speech avoids Chrome dropping the new words, and the
   utterance is kept in a variable because Chrome can cut off speech it has garbage-collected. */
let speakTok = 0, curUtter = null;
function say(text){
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    const clean = String(text).replace(/_{2,}/g, ' blank ').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').trim();
    if (!clean) return resolve();
    const tok = ++speakTok;
    try {
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      speechSynthesis.cancel();
      const start = () => {
        if (tok !== speakTok) return resolve();
        const u = new SpeechSynthesisUtterance(clean); u.rate = .85; u.pitch = 1.1; curUtter = u;
        let done = false;
        const fin = () => { if (done) return; done = true; clearTimeout(guard); resolve(); };
        const guard = setTimeout(fin, 2000 + clean.length * 120);
        u.onend = fin; u.onerror = fin;
        speechSynthesis.speak(u);
      };
      busy ? setTimeout(start, 120) : start();
    } catch(_){ resolve(); }
  });
}

function loadImageFile(file, cb){

/* ---------- drawing ---------- */
let drawCanvas = null, hue = 0;
function startDraw(){ select(null); mode = 'draw'; mountDrawLayer(); }
function mountDrawLayer(){
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.className = 'draw-layer';
  const old = slideEl.querySelector('.drawing'); if (old) old.hidden = true;
  slideEl.appendChild(c); drawCanvas = c;
  const ctx = c.getContext('2d');
  if (curSlide().drawing){ const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = curSlide().drawing; }
  c.addEventListener('pointerdown', drawDown);
}
function drawPt(e){ const r = drawCanvas.getBoundingClientRect(); return {x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height}; }
function drawDown(e){
  e.preventDefault();
  const c = drawCanvas, ctx = c.getContext('2d');
  try { c.setPointerCapture(e.pointerId); } catch(_){}
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = drawOpts.eraser ? 'destination-out' : 'source-over';
  ctx.lineWidth = drawOpts.eraser ? drawOpts.size * 3 : drawOpts.size;
  let last = drawPt(e);
  const seg = q => {
    ctx.strokeStyle = drawOpts.color === 'rainbow' ? `hsl(${(hue = (hue + 4) % 360)},90%,55%)` : drawOpts.color;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(q.x, q.y); ctx.stroke(); last = q;
  };
  seg({x:last.x + .01, y:last.y});
  const mv = ev => seg(drawPt(ev));
  const up = () => {
    c.removeEventListener('pointermove', mv); c.removeEventListener('pointerup', up); c.removeEventListener('pointercancel', up);
    curSlide().drawing = c.toDataURL('image/png'); commit();
  };
  c.addEventListener('pointermove', mv); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
}
function stopDraw(silent){
  if (mode !== 'draw') return;
  mode = 'select'; drawCanvas = null;
  if (drawerKind === 'draw'){ drawerKind = null; drawer.hidden = true; markTools(); }
  if (!silent) renderStage();
}

insp.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, val = b.dataset.val, m = selEl(), s = curSlide();
  const els = s.els;
  switch (act){
    case 'size': m.size = clamp(Math.round(m.size * (val === '1' ? 1.15 : 1 / 1.15)), 14, 420); break;
    case 'grow': { const k = val === '1' ? 1.2 : 1 / 1.2; const nw = clamp(Math.round(m.w * k), 40, 900); m.x -= (nw - m.w) / 2; m.y -= (nw - m.h) / 2; m.w = m.h = nw; break; }

    case 'say': say(m.type === 'quiz' ? `${m.question} ${m.options.join(', or ')}` : m.text); return;
    case 'saySlide': say(slideText(s)); return;
    case 'color': m.color = val === 'theme' ? null : val; break;
    case 'font': m.font = val === 'theme' ? null : val; break;
    case 'tstyle': m.style = val; break;
    case 'bold': m.bold = !m.bold; break;
    case 'align': m.align = val; break;
    case 'frame': m.frame = val; break;
    case 'pickimg': pendingImg = m.id; fileInput.click(); return;
    case 'anim': m.anim = val; break;
    case 'straight': m.rot = 0; break;
    case 'front': els.push(els.splice(els.indexOf(m), 1)[0]); break;
    case 'back': els.unshift(els.splice(els.indexOf(m), 1)[0]); break;
    case 'dup': return dupSel();
    case 'del': return deleteSel();
    case 'qcorrect': m.correct = +val; sfx('ding'); break;
    case 'qadd': m.options.push('New answer'); break;
    case 'qdel': m.options.splice(+val, 1); if (m.correct >= m.options.length) m.correct = 0; else if (m.correct > +val) m.correct--; break;
    case 'bg': s.bg = val === 'theme' ? null : val; break;
    case 'deco': s.deco = val === '1'; break;
    case 'trans': s.transition = val; break;
    case 'sup': case 'sdown': { const to = cur + (act === 'sup' ? -1 : 1); const [x] = project.slides.splice(cur, 1); project.slides.splice(to, 0, x); cur = to; commit(); renderAll(); return; }
    case 'scopy': { const c = clone(s); c.id = uid(); c.els.forEach(x => x.id = uid()); project.slides.splice(cur + 1, 0, c); cur++; commit(); renderAll(); sfx('pop'); return; }

const WZ = {

          look:'Pick your colours!', lookSub:'Tap the one you like.', name:'What is your name?', nameSub:'', ready:'Ready? Let’s go!', go:'Make my show!', skip:true},
  sprout:{topic:'What is your show about?', topicSub:'Tap a picture, or make your own.', other:'My own idea', otherHint:'Type your idea here',
          look:'Pick a look you like!', lookSub:'You can change it later.', name:'Type your name.', nameSub:'It goes on your first slide.', ready:'All ready!', go:'Make my slides!', blank:true},
  tree:  {topic:'What will your presentation be about?', topicSub:'Type your own topic, or pick an idea.', other:'My own topic', otherHint:'Type your topic here',
          look:'Choose a theme for your slides.', lookSub:'You can change it later.', name:'Who is the author?', nameSub:'Type your name. Start it with a capital letter!', ready:'Ready to start?', go:'Make my presentation', blank:true, typeFirst:true},

const WZ_STEPS = ['topic', 'look', 'name', 'ready'];
function openWizard(){
  const pf = prefs(), lv = levelOf(pf.level, pf.stage), c = WZ[lv.stage] || WZ.sprout;

document.addEventListener('keydown', e => {
  if (!$('#present').hidden) return presentKey(e);

  if (onHome()) return;
  const ae = document.activeElement;
  if (editingId || /INPUT|TEXTAREA|SELECT/.test(ae?.tagName || '') || ae?.isContentEditable) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (e.key === 'Escape'){ if (drawerKind) closeDrawer(); else select(null); return; }
  const m = selEl();
  if (!m){
    if (e.key === 'PageDown') goSlide(cur + 1);
    if (e.key === 'PageUp') goSlide(cur - 1);
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSel(); }
  else if (mod && k === 'd'){ e.preventDefault(); dupSel(); }
  else if (e.key === 'Enter' && m.type === 'text'){ e.preventDefault(); startEditing(m.id); }
  else if (e.key.startsWith('Arrow')){
    e.preventDefault(); const st = e.shiftKey ? 40 : 10;
    if (e.key === 'ArrowLeft') m.x -= st; if (e.key === 'ArrowRight') m.x += st;
    if (e.key === 'ArrowUp') m.y -= st; if (e.key === 'ArrowDown') m.y += st;
    replaceEl(m); commit();
  }

/* ---------- sounds ---------- */
let actx = null;
function tone(freq, dur, type = 'sine', when = 0, vol = .18, slideTo){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch(_){}
}
function sfx(kind){
  if (!soundOn) return;
  if (kind === 'pop') tone(500, .12, 'sine', 0, .16, 900);
  else if (kind === 'ding'){ tone(880, .25, 'triangle'); tone(1320, .4, 'triangle', .1); }
  else if (kind === 'boop') tone(260, .22, 'square', 0, .05, 160);
  else if (kind === 'whoosh') tone(300, .25, 'sawtooth', 0, .03, 1200);
  else if (kind === 'cheer') [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, 'triangle', i * .09, .14));
}

/* ---------- confetti ---------- */
const cv = $('#confetti'), cctx = cv.getContext('2d');
let parts = [], raf = 0;
const CONF = ['#FF4FA3', '#FFC83D', '#22C49A', '#5BC0FF', '#6D4AFF', '#FF8A4C'];
function confetti(x = innerWidth / 2, y = innerHeight / 3, n = 140){
  if (reduced) n = Math.min(n, 25);
  if (cv.width !== innerWidth || cv.height !== innerHeight){ cv.width = innerWidth; cv.height = innerHeight; }
  for (let i = 0; i < n; i++) parts.push({x, y, vx:(Math.random() - .5) * 16, vy:-Math.random() * 15 - 4, r:Math.random() * 6 + 5, c:CONF[i % CONF.length], a:Math.random() * 6, va:(Math.random() - .5) * .35, round:Math.random() < .4});
  if (!raf) raf = requestAnimationFrame(confLoop);
}
function confLoop(){
  cctx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.a); cctx.fillStyle = p.c;
    if (p.round){ cctx.beginPath(); cctx.arc(0, 0, p.r * .6, 0, 7); cctx.fill(); } else cctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
    cctx.restore();
  });
  parts = parts.filter(p => p.y < cv.height + 40);
  raf = parts.length ? requestAnimationFrame(confLoop) : 0;
  if (!raf) cctx.clearRect(0, 0, cv.width, cv.height);
}

  if (presentEl.hidden || !pHolder) return;
  const sc = pScale(); pHolder.style.width = W * sc + 'px'; pHolder.style.height = H * sc + 'px';
  pHolder.querySelector('.slide').style.transform = `scale(${sc})`;
});
document.addEventListener('fullscreenchange', () => { if (!presentEl.hidden) dispatchEvent(new Event('resize')); });
pArea.addEventListener('click', e => {
  const opt = e.target.closest('.q-opt');
  if (opt){
    const elDom = opt.closest('.el'); const m = project.slides[pIdx].els.find(x => x.id === elDom.dataset.id);
    if (+opt.dataset.i === m.correct){ opt.classList.add('right'); const r = opt.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top, 90); sfx('ding'); }
    else { opt.classList.remove('wrong'); void opt.offsetWidth; opt.classList.add('wrong'); sfx('boop'); }
    return;
  }
  if (e.clientX < innerWidth * .25) pPrev(); else pNext();
});
presentEl.querySelector('.p-bar').addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  const a = b.dataset.p;
  if (a === 'next') pNext();
  else if (a === 'prev') pPrev();
  else if (a === 'exit') exitPresent();
  else if (a === 'party'){ confetti(); sfx('cheer'); }
  else if (a === 'sound') setSound(!soundOn);
  else if (a === 'wand'){ wandOn = !wandOn; b.classList.toggle('on', wandOn); }
  else if (a === 'notes'){ notesOn = !notesOn; b.classList.toggle('on', notesOn); pNotes.hidden = !notesOn; }
  else if (a === 'read') readAloud();
});
function slideText(s){
  return s.els.map(e => e.type === 'text' ? e.text : e.type === 'quiz' ? `${e.question} ${e.options.join(', or ')}?` : '').filter(Boolean).join('. ');
}
function readAloud(){ say(slideText(project.slides[pIdx])); }
let lastSpark = 0;
presentEl.addEventListener('pointermove', e => {
  if (!wandOn || reduced) return;
  const now = performance.now(); if (now - lastSpark < 35) return; lastSpark = now;
  const sp = document.createElement('span'); sp.className = 'spark';
  sp.textContent = ['✨', '⭐', '💫', '🌟'][Math.floor(Math.random() * 4)];
  sp.style.left = e.clientX + 'px'; sp.style.top = e.clientY + 'px';
  document.body.appendChild(sp); setTimeout(() => sp.remove(), 900);
});

/* ---------- misc ---------- */
let toastTimer = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }
let tipI = Math.floor(Math.random() * 20);
const tipList = () => (project && level().simple) ? TIPS_Y1 : TIPS;
function showTip(){ const l = tipList(); $('#tipText').textContent = l[tipI % l.length]; }
setInterval(() => { tipI++; showTip(); }, 9000);
$('#tipSay').onclick = () => say($('#tipText').textContent);
if (!('speechSynthesis' in window)) $('#tipSay').hidden = true;

/* ---------- boot ---------- */
(function boot(){
  const id = lsGet(CUR);
  let p = id && loadProject(id);
  // The example show is only made on the very first visit, so it stays gone once deleted
  if (!p || !p.slides || !p.slides.length) p = lsGet('mypresso.seeded') ? emptyProject() : sampleProject();
  lsSet('mypresso.seeded', '1');
  project = p; resetHistory(); saveNow(); renderAll();
  showHome();
  if (!lsGet('mypresso.level')) openSetup();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderThumbs(); });
})();
})();
</script>
</body>
